[project]
name = "platypus"
version = "2.0.0"
description = "A small, self-hosted recipe collection."
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=6.1,<6.2",
  "gunicorn>=26.0.0,<27",
  "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
  "playwright>=1.55,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-django>=4.14.0,<5",
  "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "platypus.test_settings"
addopts = "--strict-config --strict-markers --cov=recipes --cov=platypus --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DJ",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
"src/platypus/test_settings.py" = ["F403", "F405"]
"tests/assert_compose_config.py" = ["S108"]
"tests/*.py" = ["PLR2004", "S101", "S314"]

[tool.coverage.run]
branch = true
omit = [
  "src/platypus/test_settings.py",
  "src/platypus/wsgi.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
