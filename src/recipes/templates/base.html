{% load static %}
<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f4eb" data-theme-color>
    <meta name="description" content="{% block description %}A personal collection of dependable recipes.{% endblock %}">
    <title>{% block title %}Platypus | Recipes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'recipes/site.css' %}">
    <script src="{% static 'recipes/theme-toggle.js' %}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{% url 'recipes:index' %}">Platypus</a>
      <div class="site-header-controls">
        <nav aria-label="Primary navigation">
          <a href="{% url 'recipes:index' %}"{% if active_section == "recipes" %} aria-current="page"{% endif %}>Recipes</a>
          <a href="{% url 'recipes:planner' %}"{% if active_section == "planner" %} aria-current="page"{% endif %}>Planner</a>
          <a href="{% url 'recipes:about' %}"{% if active_section == "about" %} aria-current="page"{% endif %}>About</a>
        </nav>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
          <span aria-hidden="true" data-theme-icon>&#127769;</span>
          <span class="visually-hidden" data-theme-label>Switch to dark mode</span>
        </button>
      </div>
    </header>
    <main id="main-content" class="page">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      Platypus recipes &middot; &copy; 2020&ndash;{% now "Y" %} <a href="https://MikeGreen.net/">Mike Green</a>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
